<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="bg-noise"></div>
  <div class="ambient-glow ambient-glow--tl"></div>
  <div class="ambient-glow ambient-glow--br"></div>

  <header class="site-header">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <span class="logo-icon">&#10070;</span>
        <span class="logo-text">{{ site.title }}</span>
      </a>
      <button class="nav-toggle" aria-label="菜单" onclick="document.querySelector('.nav-links').classList.toggle('open')">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links">
        <li><a href="{{ '/frameworks/' | relative_url }}">框架</a></li>
        <li><a href="{{ '/projects/' | relative_url }}">开源项目</a></li>
        <li><a href="{{ '/development/' | relative_url }}">开发实践</a></li>
        <li><a href="{{ '/techstack/' | relative_url }}">技术栈</a></li>
        <li><a href="{{ '/research/' | relative_url }}">研究笔记</a></li>
        <li><a href="{{ '/studies/' | relative_url }}">专题研究</a></li>
      </ul>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p class="footer-brand"><span class="logo-icon">&#10070;</span> AI Agent Research</p>
      <p class="footer-tagline">持续探索智能体的边界</p>
    </div>
  </footer>
</body>
</html>
