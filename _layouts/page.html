---
layout: default
---

<div class="page-container">
  {% if page.category %}
    <div class="category-tag">{{ page.category }}</div>
  {% endif %}
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.date %}
    <div class="post-date">{{ page.date | date: "%Y-%m-%d" }}</div>
  {% endif %}
  <div class="page-content">
    {{ content }}
  </div>
</div>
